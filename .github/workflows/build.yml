name: Build Ashen Echo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Export (Web + Windows)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import assets
        run: godot --headless --path . --import

      - name: Install export templates
        run: |
          set -e
          DEST="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$DEST"
          if command -v python3 >/dev/null 2>&1; then
            python3 - <<'PY'
          import urllib.request, zipfile, os, shutil
          url = "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
          urllib.request.urlretrieve(url, "/tmp/templates.tpz")
          with zipfile.ZipFile("/tmp/templates.tpz") as z:
              z.extractall("/tmp/template-extract")
          src = None
          for root, dirs, files in os.walk("/tmp/template-extract"):
              if os.path.basename(root) == "templates":
                  src = root
                  break
          if src is None:
              src = "/tmp/template-extract"
          dest = os.path.expanduser("~/.local/share/godot/export_templates/4.4.1.stable")
          os.makedirs(dest, exist_ok=True)
          for item in os.listdir(src):
              s = os.path.join(src, item)
              d = os.path.join(dest, item)
              if os.path.isdir(s):
                  shutil.copytree(s, d, dirs_exist_ok=True)
              else:
                  shutil.copy2(s, d)
          print(sorted(os.listdir(dest)))
          PY
          else
            apt-get update -qq && apt-get install -y -qq curl unzip
            curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/templates.tpz
            mkdir -p /tmp/template-extract
            unzip -o -q /tmp/templates.tpz -d /tmp/template-extract
            TEMPLATE_DIR="$(find /tmp/template-extract -type d -name templates -print -quit)"
            if [ -z "$TEMPLATE_DIR" ]; then
              TEMPLATE_DIR="/tmp/template-extract"
            fi
            cp -R "$TEMPLATE_DIR"/. "$DEST/"
          fi
          ls "$DEST"

      - name: Export Web
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/AshenEcho.exe

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashen-echo-web
          path: build/web

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashen-echo-windows
          path: build/windows

  build-ios:
    name: Export iOS IPA (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.4.1
        run: |
          set -e
          curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -o "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot-bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot-bin" -type f -path '*/Contents/MacOS/Godot' -print -quit)"
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN="$(find "$RUNNER_TEMP/godot-bin" -type f -name Godot -print -quit)"
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot export templates
        run: |
          set -e
          curl -fL "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/template-extract"
          unzip -o "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/template-extract"
          TEMPLATE_DIR="$(find "$RUNNER_TEMP/template-extract" -type d -name templates -print -quit)"
          if [ -z "$TEMPLATE_DIR" ]; then
            TEMPLATE_DIR="$RUNNER_TEMP/template-extract"
          fi
          DEST="$HOME/Library/Application Support/Godot/export_templates/4.4.1.stable"
          mkdir -p "$DEST"
          cp -R "$TEMPLATE_DIR"/. "$DEST/"

      - name: Generate iOS icons from icon.svg
        run: |
          set -e
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            brew install librsvg
          fi
          ICON_DIR="assets/icons"
          mkdir -p "$ICON_DIR"
          rsvg-convert -w 1024 -h 1024 icon.svg -o "$ICON_DIR/app_store_1024.png"
          sips -z 58 58 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/settings_58.png"
          sips -z 87 87 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/settings_87.png"
          sips -z 40 40 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/notification_40.png"
          sips -z 60 60 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/notification_60.png"
          sips -z 76 76 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/notification_76.png"
          sips -z 114 114 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/notification_114.png"
          sips -z 80 80 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/spotlight_80.png"
          sips -z 120 120 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/spotlight_120.png"
          sips -z 120 120 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/iphone_120.png"
          sips -z 180 180 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/iphone_180.png"
          sips -z 167 167 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/ipad_167.png"
          sips -z 152 152 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/ipad_152.png"
          sips -z 128 128 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/ios_128.png"
          sips -z 192 192 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/ios_192.png"
          sips -z 136 136 "$ICON_DIR/app_store_1024.png" --out "$ICON_DIR/ios_136.png"
          ls -lh "$ICON_DIR"

      - name: Import Godot project
        run: |
          set -e
          "$GODOT" --headless --editor --path . --quit

      - name: Run integration test (36 checks)
        continue-on-error: true
        run: |
          set +e
          ASHEN_TEST=1 "$GODOT" --headless --path . > test.log 2>&1
          echo "test exit code: $?"
          grep -E "TEST_RESULT|\[FAIL\]" test.log || echo "(no TEST_RESULT line in log)"
          tail -5 test.log

      - name: Create iOS export preset
        run: |
          set -e
          cat > export_presets.cfg <<'PRESET'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ashen-echo.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          application/bundle_identifier="com.ashenecho.game"
          application/app_store_team_id="XXXXXXXXXX"
          application/short_version="1.0.0"
          application/version="1.0.0"
          application/name="烬峰回响"
          application/export_project_only=true
          display/orientation="landscape"
          icons/settings_58x58="res://assets/icons/settings_58.png"
          icons/settings_87x87="res://assets/icons/settings_87.png"
          icons/notification_40x40="res://assets/icons/notification_40.png"
          icons/notification_60x60="res://assets/icons/notification_60.png"
          icons/notification_76x76="res://assets/icons/notification_76.png"
          icons/notification_114x114="res://assets/icons/notification_114.png"
          icons/spotlight_80x80="res://assets/icons/spotlight_80.png"
          icons/spotlight_120x120="res://assets/icons/spotlight_120.png"
          icons/iphone_120x120="res://assets/icons/iphone_120.png"
          icons/iphone_180x180="res://assets/icons/iphone_180.png"
          icons/ipad_167x167="res://assets/icons/ipad_167.png"
          icons/ipad_152x152="res://assets/icons/ipad_152.png"
          icons/ios_128x128="res://assets/icons/ios_128.png"
          icons/ios_192x192="res://assets/icons/ios_192.png"
          icons/ios_136x136="res://assets/icons/ios_136.png"
          icons/app_store_1024x1024="res://assets/icons/app_store_1024.png"
          PRESET

      - name: Export iOS Xcode project
        run: |
          set -e
          mkdir -p build
          "$GODOT" --headless --path . --export-release "iOS" build/ashen-echo.zip
          test -s build/ashen-echo.zip || test -d build/ashen-echo.xcodeproj

      - name: Locate Xcode project
        run: |
          set -e
          if [ -s build/ashen-echo.zip ]; then
            mkdir -p build/xcode
            unzip -o build/ashen-echo.zip -d build/xcode
            XCODEPROJ="$(find build/xcode -name '*.xcodeproj' -print -quit)"
          else
            XCODEPROJ="$(find build -maxdepth 2 -name '*.xcodeproj' -print -quit)"
          fi
          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: 没有找到 Xcode 项目"
            find build -maxdepth 3 -print
            exit 1
          fi
          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"
          echo "Xcode project: $XCODEPROJ"

      - name: Build unsigned iOS app
        run: |
          set -e
          SCHEME="$(basename "$XCODEPROJ" .xcodeproj)"
          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          APP_PATH="$(find build/DerivedData/Build/Products -maxdepth 5 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Xcode 没有生成 .app"
            find build/DerivedData/Build/Products -maxdepth 5 -print
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -e
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../ashen-echo-unsigned.ipa Payload
          test -s ../ashen-echo-unsigned.ipa
          ls -lh ../ashen-echo-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ashen-echo-ios-ipa
          path: |
            build/ashen-echo-unsigned.ipa
            build/ashen-echo.zip
          if-no-files-found: warn
          retention-days: 14

  deploy-pages:
    name: Deploy Web to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: ashen-echo-web
          path: build/web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
